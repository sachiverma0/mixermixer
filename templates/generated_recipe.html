<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ recipe['name'] }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        ul { padding: 0; list-style-type: none; }
        ul li { margin: 5px 0; }
        button { padding: 10px 15px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>{{ recipe['name'] }}</h1>
    
    <h3>Ingredients</h3>
    <ul>
        {% for ingredient in recipe['ingredients'] %}
        <li>{{ ingredient['ingredient_name'] }} - {{ ingredient['ingredient_portion'] }}</li>
        {% endfor %}
    </ul>
    
    <h3>Instructions</h3>
    <ol>
        {% for step in recipe['instructions'] %}
        <li>{{ step }}</li>
        {% endfor %}
    </ol>
    
    <!-- Buttons -->
    <form action="/save_recipe" method="POST" id="saveForm">
        <input type="hidden" name="recipe" value="{{ recipe | tojson }}">
        <button type="submit">Save Recipe</button>
    </form>
    <form action="/generate_recipe" method="GET">
        <input type="hidden" name="theme" value="{{ theme }}">
        <button type="submit">Generate Another Recipe</button>
    </form>
    
    <script>
        document.getElementById("saveForm").addEventListener("submit", function(event) {
            event.preventDefault();
            fetch("/save_recipe", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({{ recipe | tojson }})
            })
            .then(response => response.json())
            .then(data => alert(data.message))
            .catch(error => alert("Error saving recipe: " + error));
        });
    </script>
</body>
</html>
